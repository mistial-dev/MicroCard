[package]
name="microcard-fuzz"
version="0.0.0"
edition="2021"
publish=false
[package.metadata]
cargo-fuzz=true
[dependencies]
libfuzzer-sys="0.4"
serde_json="1"
microcard-core={path="../crates/microcard-core",features=["fuzzing"]}
[[bin]]
name="boundaries"
path="fuzz_targets/boundaries.rs"
test=false
doc=false
bench=false
[workspace]
members=["."]

[[bin]]
name="signed_packages"
path="fuzz_targets/signed_packages.rs"
test=false
doc=false
bench=false

[[bin]]
name="crypto_arguments"
path="fuzz_targets/crypto_arguments.rs"
test=false
doc=false
bench=false

[[bin]]
name="domain_sequences"
path="fuzz_targets/domain_sequences.rs"
test=false
doc=false
bench=false
