name: Release bundles

on:
  workflow_dispatch:
  push:
    tags: ['0.1-wip']

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.1
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - name: Install objcopy wrapper
        run: cargo install cargo-binutils --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Pinned firmware build inputs
        run: |
          python scripts/fetch_arm_toolchain.py
          python scripts/fetch_nrf_crypto_sources.py
      - name: Host acceptance
        run: python scripts/wallet_acceptance.py
      - name: Package
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MicroCard-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/release/*.tar.gz
          if-no-files-found: error
