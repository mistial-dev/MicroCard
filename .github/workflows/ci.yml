name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.1
          targets: thumbv7em-none-eabihf
          components: clippy
      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Quick validation
        run: python scripts/check.py
      - name: Wallet acceptance
        run: python scripts/wallet_acceptance.py
      - name: Java Card applet acceptance
        run: |
          cargo build --locked
          python scripts/piv_vector_acceptance.py
          python scripts/jcvm_transport_acceptance.py
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ARM link inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
      - name: Separate firmware links and budgets
        if: runner.os == 'Linux'
        run: python scripts/board_budgets.py --check
