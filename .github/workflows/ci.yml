name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.1
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Quick validation
        run: python scripts/check.py
      - name: Wallet acceptance
        run: python scripts/wallet_acceptance.py
      - name: Java Card applet acceptance
        run: |
          cargo build --locked -p microcard-sim --features jcvm-diagnostics
          python scripts/piv_vector_acceptance.py
          python scripts/jcalgtest_acceptance.py
          python scripts/jcvm_transport_acceptance.py
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pinned ARM compiler and link inspection tools
        if: runner.os == 'Linux'
        run: python scripts/fetch_arm_toolchain.py
      - name: Pinned hardware crypto inputs
        if: runner.os == 'Linux'
        run: python scripts/fetch_nrf_crypto_sources.py
      - name: Separate firmware links and budgets
        if: runner.os == 'Linux'
        run: python scripts/board_budgets.py --check
      - name: Hardware crypto replacement links
        if: runner.os == 'Linux'
        run: |
          python scripts/crypto_provider_matrix.py --engine mc04 --output work/crypto-mc04-dk.json
          python scripts/crypto_provider_matrix.py --engine mc04 --layout dongle --output work/crypto-mc04-dongle.json
          python scripts/crypto_provider_matrix.py --engine jcvm --output work/crypto-jcvm-dk.json
          python scripts/crypto_provider_matrix.py --engine jcvm --layout dongle --output work/crypto-jcvm-dongle.json
