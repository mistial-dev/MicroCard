[package]
name = "microcard-engine-jcvm"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
# Mnemonics for error messages and tooling. A card build leaves this off, because the names
# cost flash and nothing on the card prints them.
diagnostics = []
[dependencies]
microcard-memory = { path = "../microcard-memory" }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
[dev-dependencies]
# The test host answers digests with a real implementation, so the engine is exercised
# against the same answers a card would give.
sha2.workspace = true
