[package]
name = "microcard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = ["scp03-rmac", "scp03-renc", "scp03-s16", "scp03-pseudo-random"]
fuzzing = []
hal-conformance = []
# Optional SCP03 capabilities. The advertised i parameter and the accepted security
# levels are derived from this set, so a build cannot offer a mode it does not implement.
scp03-rmac = []
# Table 5-1 encodes b7 b6 as 00, 01 or 11 and reserves 10, so response encryption always
# carries response integrity with it.
scp03-renc = ["scp03-rmac"]
scp03-s16 = []
# The card challenge is derived from a durable sequence counter rather than drawn from
# entropy, which costs a reserved block of counter values in the journaled state.
scp03-pseudo-random = []
[dependencies]
base64ct.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
p256.workspace = true
aes = { version = "0.8", default-features = false }
cmac = { version = "0.7", default-features = false }
hmac = { version = "0.12", default-features = false }
ccm = { version = "0.5", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
