[package]
name = "microcard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = ["mc04", "software-crypto", "scp03-rmac", "scp03-renc", "scp03-s16", "scp03-pseudo-random"]
software-crypto = ["software-sha256", "software-hmac", "software-aes", "software-p256"]
software-sha256 = ["dep:sha2"]
software-hmac = ["dep:hmac", "dep:sha2"]
software-aes = ["dep:aes", "dep:cmac", "dep:ccm"]
software-p256 = ["dep:p256"]
mc04 = ["dep:microcard-memory"]
jcvm = ["dep:microcard-engine-jcvm"]
fuzzing = []
hal-conformance = []
# Optional SCP03 capabilities. The advertised i parameter and the accepted security
# levels are derived from this set, so a build cannot offer a mode it does not implement.
scp03-rmac = []
# Table 5-1 encodes b7 b6 as 00, 01 or 11 and reserves 10, so response encryption always
# carries response integrity with it.
scp03-renc = ["scp03-rmac"]
scp03-s16 = []
# The card challenge is derived from a durable sequence counter rather than drawn from
# entropy, which costs a reserved block of counter values in the journaled state.
scp03-pseudo-random = []
[dependencies]
microcard-memory = { path = "../microcard-memory", optional = true }
microcard-engine-jcvm = { path = "../microcard-engine-jcvm", optional = true }
base64ct.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
aes = { version = "0.8", default-features = false, optional = true }
cmac = { version = "0.7", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
ccm = { version = "0.5", default-features = false, optional = true }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "runtime"
required-features = ["mc04", "software-crypto"]

[[test]]
name = "package_profile"
required-features = ["mc04", "software-crypto"]

[[test]]
name = "signed_malformed"
required-features = ["mc04", "software-crypto"]

[[test]]
name = "ecdsa_p256"
required-features = ["software-p256"]
