[package]
name = "microcard-nrf52840"
version = "0.1.0-wip"
edition = "2021"
license = "AGPL-3.0-or-later"
[features]
default = ["development-debug", "cc310"]
engine-mc04 = ["microcard-core/mc04"]
engine-jcvm = ["microcard-core/jcvm"]
development-debug = []
cc310 = ["cc310-sha256", "cc310-entropy", "cc310-cmac", "cc310-hmac", "cc310-aes", "cc310-cbc", "cc310-ccm", "cc310-p256"]
software-crypto = ["microcard-core/software-crypto"]
software-sha256 = ["microcard-core/software-sha256"]
software-hmac = ["microcard-core/software-hmac"]
software-aes = ["microcard-core/software-aes"]
software-p256 = ["microcard-core/software-p256"]
usb-ccid = ["dep:nrf52840-hal", "dep:usb-device", "dep:usbd-ccid", "dep:heapless", "dep:interchange"]
# The Makerdiary nRF52840 MDK USB Dongle flash map, which links at the current UF2
# bootloader's 0x1000 application origin. It carries USB CCID as its only management
# transport, because the board has no debug probe and no serial port.
dongle-layout = ["usb-ccid"]
# Fall back to the GlobalPlatform well-known test keys when the key page is erased, so a
# freshly flashed board answers ordinary tooling with no probe. A board built this way is
# claimable by anyone until its first signed assembly takes ownership. Never for a product.
gp-test-keys = []
# The convenience build for a development dongle, which is both of the above.
dongle = ["dongle-layout", "gp-test-keys"]
cc310-sha256 = []
cc310-entropy = ["cc310-sha256"]
cc310-cmac = ["cc310-entropy"]
cc310-hmac = ["cc310-entropy"]
cc310-aes = ["cc310-entropy"]
cc310-cbc = ["cc310-aes"]
cc310-ccm = ["cc310-aes"]
cc310-p256 = ["cc310-entropy"]

[dependencies]
microcard-core = { path = "../../crates/microcard-core", default-features = false, features = ["scp03-rmac", "scp03-renc", "scp03-s16", "scp03-pseudo-random"] }
cortex-m = {version="0.7", features=["critical-section-single-core"]}
cortex-m-rt = { version = "0.7", features = ["set-vtor"] }
embedded-alloc = "0.6"
nrf52840-hal = { version = "0.19", optional = true }
usb-device = { version = "0.3.2", optional = true }
usbd-ccid = { version = "0.5.0", optional = true }
heapless = { version = "0.9", optional = true }
interchange = { version = "0.3", optional = true }
[build-dependencies]
sha2 = "0.10"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
